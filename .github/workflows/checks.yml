name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d orders_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lab:lab@localhost:5432/orders_test
      - run: uv run python scripts/check_materials.py
      - run: terraform fmt -check -recursive infra
      - name: Validate both roots without backend credentials
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/dev init -backend=false -input=false
          terraform -chdir=infra/dev validate
          terraform -chdir=infra/dev test
