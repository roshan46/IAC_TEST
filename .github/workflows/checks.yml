name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d orders_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lab:lab@localhost:5432/orders_test
      - run: uv run python scripts/check_materials.py
      - run: terraform fmt -check -recursive infra
      - name: Validate both roots without backend credentials
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/dev init -backend=false -input=false
          terraform -chdir=infra/dev validate
          terraform -chdir=infra/dev test
