name: Plan lab changes
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan deployment or teardown
        type: choice
        options: [deploy, destroy]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: order-manager-dev
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.LAB_READY == 'true'
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-2
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      LEARNER_CIDR: ${{ vars.LEARNER_CIDR }}
      AMI_ID: ${{ vars.AMI_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: terraform fmt -check -recursive infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: us-east-2
      - name: Save private reviewed plan
        env:
          OPERATION: ${{ inputs.operation }}
        run: uv run python scripts/pipeline.py plan "$OPERATION"
