[project]
name = "order-manager-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Flask>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "gunicorn>=23,<24; sys_platform != 'win32'",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
